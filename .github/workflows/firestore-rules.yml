name: Firestore rules

on:
  pull_request:
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - 'apps/web/src/features/account/**'
      - 'apps/web/tests/firestore/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/firestore-rules.yml'
  push:
    branches: [main]
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - 'apps/web/src/features/account/**'
      - 'apps/web/tests/firestore/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-rules:
    name: Private profile security rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - run: bun run test:firestore
