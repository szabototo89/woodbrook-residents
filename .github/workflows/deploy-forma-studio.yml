name: Deploy Forma Studio

on:
  push:
    branches: [main]
    paths:
      - 'apps/forma-studio-web/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-forma-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forma-studio-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Forma Studio to Cloudflare Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Forma Studio types
        run: bun run --cwd apps/forma-studio-web typecheck

      - name: Test Forma Studio
        run: bun run --cwd apps/forma-studio-web test:unit

      - name: Build static Forma Studio site
        run: bun run --cwd apps/forma-studio-web build

      - name: Deploy to Cloudflare Pages
        working-directory: apps/forma-studio-web
        run: bunx wrangler pages deploy dist/client --project-name=forma-studio-web --branch=main --commit-hash=${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
