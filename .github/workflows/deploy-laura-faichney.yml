name: Deploy Laura Faichney

on:
  push:
    branches: [main]
    paths:
      - 'apps/laura-faichney-web/**'
      - '.github/workflows/deploy-laura-faichney.yml'
  repository_dispatch:
    types: [sanity-update]
  workflow_dispatch:

# Sanity delivers at-least-once with 1 concurrent request and retries twice
# at 30s intervals. Serialize Pages deploys so overlapping publishes queue
# instead of racing; every dispatch rebuilds the same static output.
concurrency:
  group: laura-faichney-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Laura Faichney to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log triggering event
        run: |
          echo "event=${{ github.event_name }} type=${{ github.event.action }}"
          echo 'payload=${{ toJson(github.event.client_payload) }}'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install

      - name: Build static Laura Faichney site
        run: bun run --cwd apps/laura-faichney-web build:static
        env:
          VITE_PUBLIC_SITE_URL: https://laura-faichney-all-things-art.pages.dev

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/laura-faichney-web
          command: pages deploy dist/client --project-name=laura-faichney-all-things-art --branch=main --commit-hash=${{ github.sha }}
