name: Deploy Laura Faichney

on:
  push:
    branches: [main]
    paths:
      - 'apps/laura-faichney-web/**'
      - '.github/workflows/deploy-laura-faichney.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Laura Faichney to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install

      - name: Build static Laura Faichney site
        run: bun run --cwd apps/laura-faichney-web build:static
        env:
          VITE_PUBLIC_SITE_URL: https://laura-faichney-all-things-art.pages.dev

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/laura-faichney-web/dist/client --project-name=laura-faichney-all-things-art --branch=main --commit-hash=${{ github.sha }}
