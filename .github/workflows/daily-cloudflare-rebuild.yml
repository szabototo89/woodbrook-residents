name: Daily Sanity Cloudflare rebuild

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    name: Trigger production Sanity rebuild
    runs-on: ubuntu-latest
    steps:
      # Content selection belongs to the Cloudflare build environment:
      # CONTENT_SOURCE=sanity. Action env values are not forwarded by the hook.
      - name: Trigger Cloudflare Workers Build
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            "$DEPLOY_HOOK_URL"
