name: Clean up Cloudflare previews

# Runs every day at 02:17 UTC. Scheduled workflows use the default branch.
# Preview retention and recovery are documented in
# docs/operations/cloudflare-preview-retention.md.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List eligible preview deployments without deleting them
        type: boolean
        default: false

permissions:
  contents: read

# Never allow two cleanup runs to overlap. Preview deploys do not join this
# group: the run-start cutoff protects every deployment created during a run.
concurrency:
  group: cloudflare-preview-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete preview deployments older than seven days
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Check cleanup tests and inventory
        run: bun test scripts/cloudflare-preview-cleanup.test.ts

      - name: Clean up preview deployments
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # A dedicated token can replace the shared deploy token once it is
          # provisioned with Pages Read and Pages Write on every configured app.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_CLEANUP_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: bun scripts/cloudflare-preview-cleanup.ts ${{ inputs.dry_run && '--dry-run' || '' }}
